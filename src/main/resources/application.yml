spring:
  application:
    name: Karman

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP 연결 풀 설정 (Supabase 무료 플랜 대응)
    hikari:
      maximum-pool-size: 4       # 무료 플랜 동시 연결 수 제한 고려
      minimum-idle: 1            # 최소 유휴 연결 (0으로 하면 응답 지연될 수 있음)
      connection-timeout: 20000  # 20초 (연결 맺기까지 대기 시간)
      idle-timeout: 300000       # 5분 (아무것도 안 하면 연결 끊고 리소스 반환)
      max-lifetime: 600000       # 10분 (연결의 최대 수명, Supabase보다 짧게 설정해야 함)
      leak-detection-threshold: 60000
      # Prepared statement 캐싱 비활성화 (핵심 설정)
      data-source-properties:
        prepareThreshold: 0
        tcpKeepAlive: true
        socketTimeout: 20

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 연결 유지 설정
        connection:
          provider_disables_autocommit: false
        # 트랜잭션 타임아웃 설정
        transaction:
          timeout: 20
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        table-name: tactical_documents
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        schema-validation: true

  jwt:
    secret: ${JWT_SECRET}